# MADC Framework Configuration

# API Configuration
api:
  api_key: ""  # Set via environment variable OPENAI_API_KEY
  base_url: "https://api.openai.com/v1"
  timeout: 60
  max_retries: 3
  retry_delay: 1.0

# Stage-specific Model Configuration
stages:
  observation:
    name: "gpt-4o"
    temperature: 0.7
    max_tokens: 2048
    top_p: 0.95

  reflection:
    name: "gpt-4o"
    temperature: 0.3
    max_tokens: 512
    top_p: 0.95

  reasoning:
    name: "gpt-4o"
    temperature: 0.7
    max_tokens: 2048
    top_p: 0.95

  decision:
    name: "gpt-4o"
    temperature: 0.5
    max_tokens: 1024
    top_p: 0.95

# Experiment Configuration
experiment:
  dataset_path: "./data"
  output_dir: "./results"
  log_dir: "./logs"
  batch_size: 1
  save_intermediate: true
  verbose: true
